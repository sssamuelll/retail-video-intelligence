[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-video-intelligence"
version = "0.1.0"
description = "On-premises scaffold for CCTV event normalization and search"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Pending"}
authors = [{name = "Retail Video Intelligence contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8"]

[project.scripts]
rvi = "retail_video_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
